# sandbox-validate: run a candidate patch through the codemender-sandbox
# Cloud Run Job (gen2 microVM, egress-denied VPC, no-permission SA) and report
# the SANDBOX_RESULT verdict.
#
# Patch source: give exactly one of
#   patch_path  a diff file in this repo, e.g. patches/CM-0001-sqli.diff
#   branch      a branch with the fix, e.g. security/CM-0001-parameterize-sql.
#               The patch is `git diff <commit_sha>...origin/<branch>` (changes on
#               the branch since its merge base with commit_sha).
# The job always runs against the base commit `commit_sha`. The patch is
# uploaded to gs://SANDBOX_BUCKET/patches/<issue_id>/<run_id>.diff.
# pr_number is optional: when set, the result is posted as a PR comment.
#
# The workflow fails unless the verdict is PATCH_VERIFIED, so it can be used
# as a required status check.
#
# Actions are pinned to major versions. For production, pin each action to a
# full commit SHA (e.g. actions/checkout@<sha> # v4) and update with Dependabot.

name: sandbox-validate

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: "Finding ID, e.g. CM-0001"
        type: string
        required: true
      commit_sha:
        description: "Base commit the patch applies to (the scanned commit)"
        type: string
        required: true
      patch_path:
        description: "Diff file in this repo (set this OR branch)"
        type: string
        required: false
        default: ""
      branch:
        description: "Fix branch, e.g. security/CM-0001-parameterize-sql (set this OR patch_path)"
        type: string
        required: false
        default: ""
      pr_number:
        description: "Optional PR number to comment the result on"
        type: string
        required: false
        default: ""
      poc_test:
        description: "PoC test path (default: derived from issue_id, else tests/poc)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: sandbox-validate-${{ inputs.issue_id }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  SANDBOX_BUCKET: ${{ vars.SANDBOX_BUCKET }}
  SANDBOX_JOB: codemender-sandbox
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  ISSUE_ID: ${{ inputs.issue_id }}
  INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
  PATCH_PATH: ${{ inputs.patch_path }}
  BRANCH: ${{ inputs.branch }}
  PR_NUMBER: ${{ inputs.pr_number }}
  INPUT_POC_TEST: ${{ inputs.poc_test }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        id: meta
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "${GCP_PROJECT_ID}" ] && [ -n "${GCP_REGION}" ] && [ -n "${SANDBOX_BUCKET}" ] \
            || fail "Set repository variables GCP_PROJECT_ID, GCP_REGION and SANDBOX_BUCKET"

          [[ "${ISSUE_ID}" =~ ^[A-Za-z0-9._-]+$ ]] \
            || fail "issue_id '${ISSUE_ID}' may only contain letters, digits, '.', '_' and '-'"

          if [ -n "${PATCH_PATH}" ] && [ -n "${BRANCH}" ]; then
            fail "Give exactly one of patch_path or branch, not both"
          fi
          if [ -z "${PATCH_PATH}" ] && [ -z "${BRANCH}" ]; then
            fail "Give exactly one of patch_path or branch (neither was set)"
          fi

          if [ -n "${PR_NUMBER}" ] && ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            fail "pr_number '${PR_NUMBER}' must be a number"
          fi

          full_sha="$(git rev-parse --verify --quiet "${INPUT_COMMIT_SHA}^{commit}")" \
            || fail "commit_sha '${INPUT_COMMIT_SHA}' is not a commit in this repository"

          poc_test="${INPUT_POC_TEST}"
          if [ -z "${poc_test}" ]; then
            case "${ISSUE_ID}" in
              CM-0001) poc_test="tests/poc/test_poc_sqli.py" ;;
              CM-0002) poc_test="tests/poc/test_poc_path_traversal.py" ;;
              *)       poc_test="tests/poc" ;;
            esac
          fi
          [[ "${poc_test}" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "${poc_test}" != *..* ]] \
            || fail "poc_test '${poc_test}' is not a safe relative path"

          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          {
            echo "commit_sha=${full_sha}"
            echo "poc_test=${poc_test}"
            echo "source_uri=gs://${SANDBOX_BUCKET}/sources/${owner}__${name}/${full_sha}.tar.gz"
            echo "patch_uri=gs://${SANDBOX_BUCKET}/patches/${ISSUE_ID}/${RUN_ID}.diff"
          } >> "$GITHUB_OUTPUT"

      - name: Build patch file
        id: patch
        env:
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          out="${RUNNER_TEMP}/patch.diff"

          if [ -n "${PATCH_PATH}" ]; then
            case "${PATCH_PATH}" in
              /*|*..*) fail "patch_path must be a relative path inside the repo without '..'" ;;
            esac
            [ -f "${PATCH_PATH}" ] || fail "patch_path '${PATCH_PATH}' does not exist at ${GITHUB_SHA}"
            cp "${PATCH_PATH}" "${out}"
            echo "source=patch_path ${PATCH_PATH}" >> "$GITHUB_OUTPUT"
          else
            git check-ref-format --branch "${BRANCH}" >/dev/null \
              || fail "branch '${BRANCH}' is not a valid branch name"
            if [[ "${BRANCH}" != security/* ]]; then
              echo "::warning::branch '${BRANCH}' does not follow security/<finding-id>-<slug>"
            fi
            git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" \
              || fail "branch '${BRANCH}' was not found on origin"
            git diff "${COMMIT_SHA}...origin/${BRANCH}" > "${out}"
            echo "source=branch ${BRANCH} ($(git rev-parse "origin/${BRANCH}"))" >> "$GITHUB_OUTPUT"
          fi

          [ -s "${out}" ] || fail "The patch is empty; nothing to validate"
          echo "Patch: $(grep -c '^+++ ' "${out}") file(s) changed"
          cat "${out}"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Stage source (if missing) and upload patch
        env:
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          SOURCE_URI: ${{ steps.meta.outputs.source_uri }}
          PATCH_URI: ${{ steps.meta.outputs.patch_uri }}
        run: |
          set -euo pipefail
          if gcloud storage ls "${SOURCE_URI}" --project "${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Source already staged: ${SOURCE_URI}"
          else
            git archive --format=tar.gz -o "${RUNNER_TEMP}/source.tar.gz" "${COMMIT_SHA}"
            gcloud storage cp "${RUNNER_TEMP}/source.tar.gz" "${SOURCE_URI}" --project "${GCP_PROJECT_ID}"
            echo "Staged ${SOURCE_URI}"
          fi
          gcloud storage cp "${RUNNER_TEMP}/patch.diff" "${PATCH_URI}" --project "${GCP_PROJECT_ID}"
          echo "Uploaded ${PATCH_URI}"

      - name: Run sandbox job
        id: run
        env:
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          SOURCE_URI: ${{ steps.meta.outputs.source_uri }}
          PATCH_URI: ${{ steps.meta.outputs.patch_uri }}
          POC_TEST: ${{ steps.meta.outputs.poc_test }}
        run: |
          set -uo pipefail
          # Values must not contain commas (gcloud --update-env-vars separator).
          # All values here are validated above or GCS paths built from them.
          rc=0
          execution="$(gcloud run jobs execute "${SANDBOX_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --update-env-vars "RUN_ID=${RUN_ID},REPOSITORY=${GITHUB_REPOSITORY},COMMIT_SHA=${COMMIT_SHA},SOURCE_URI=${SOURCE_URI},PATCH_URI=${PATCH_URI},ISSUE_ID=${ISSUE_ID},POC_TEST=${POC_TEST}" \
            --wait \
            --format='value(metadata.name)')" || rc=$?
          echo "execution_name=${execution}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          # A non-zero exit can mean the job reported a failing verdict; the
          # SANDBOX_RESULT log entry is the source of truth, so keep going.
          echo "Execution: ${execution:-unknown} (gcloud exit ${rc})"

      - name: Read SANDBOX_RESULT from Cloud Logging
        id: result
        run: |
          set -euo pipefail
          filter="resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${SANDBOX_JOB}\" AND jsonPayload.event_type=\"SANDBOX_RESULT\" AND jsonPayload.run_id=\"${RUN_ID}\""
          out="${RUNNER_TEMP}/result.json"
          for attempt in $(seq 1 12); do
            gcloud logging read "${filter}" --project "${GCP_PROJECT_ID}" \
              --freshness=2h --limit=1 --order=desc --format=json > "${RUNNER_TEMP}/entries.json"
            if [ "$(jq 'length' "${RUNNER_TEMP}/entries.json")" -gt 0 ]; then
              jq '.[0].jsonPayload' "${RUNNER_TEMP}/entries.json" > "${out}"
              break
            fi
            echo "No SANDBOX_RESULT yet (attempt ${attempt}/12); waiting for log ingestion"
            sleep 10
          done
          if [ ! -s "${out}" ]; then
            jq -n --arg run "${RUN_ID}" \
              '{run_id: $run, verdict: "ERROR", message: "No SANDBOX_RESULT log entry found for this run_id"}' > "${out}"
          fi
          echo "verdict=$(jq -r '.verdict // "ERROR"' "${out}")" >> "$GITHUB_OUTPUT"
          jq . "${out}"

      - name: Report result
        if: always()
        env:
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
          PATCH_URI: ${{ steps.meta.outputs.patch_uri }}
          PATCH_SOURCE: ${{ steps.patch.outputs.source }}
          EXECUTION_NAME: ${{ steps.run.outputs.execution_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/result.json"
          [ -s "${result}" ] || echo '{"verdict": "ERROR", "message": "Workflow failed before the sandbox result was read"}' > "${result}"
          report="${RUNNER_TEMP}/report.md"
          {
            echo "## Sandbox validation: ${ISSUE_ID}"
            echo ""
            echo "**Verdict: $(jq -r '.verdict // "ERROR"' "${result}")**"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| run_id | \`${RUN_ID}\` |"
            echo "| execution | \`$(jq -r --arg e "${EXECUTION_NAME}" '.execution_name // $e' "${result}")\` |"
            echo "| repository | \`${GITHUB_REPOSITORY}\` |"
            echo "| base commit | \`${COMMIT_SHA}\` |"
            echo "| patch source | ${PATCH_SOURCE:-n/a} |"
            echo "| patch | \`${PATCH_URI}\` |"
            jq -r '
              [["poc_test", .poc_test], ["poc_before", .poc_before], ["poc_after", .poc_after],
               ["patch_applied", .patch_applied], ["unit_tests_passed", .unit_tests_passed],
               ["tests_total", .tests_total], ["tests_failed", .tests_failed],
               ["started_at", .started_at], ["finished_at", .finished_at]][]
              | "| \(.[0]) | \(.[1] // "n/a") |"' "${result}"
            echo ""
            echo "<details><summary>Log excerpt</summary>"
            echo ""
            echo '```'
            jq -r '.log_excerpt // .message // ""' "${result}"
            echo '```'
            echo "</details>"
          } > "${report}"
          cat "${report}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${PR_NUMBER}" ]; then
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${report}"
          fi

      - name: Require PATCH_VERIFIED
        env:
          VERDICT: ${{ steps.result.outputs.verdict }}
        run: |
          if [ "${VERDICT}" != "PATCH_VERIFIED" ]; then
            echo "::error::Sandbox verdict is ${VERDICT:-ERROR}, not PATCH_VERIFIED"
            exit 1
          fi
          echo "Patch verified."
