  <text x="800" y="301" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">GitHub remote MCP</text>
  <text x="800" y="319" font-size="12" text-anchor="middle" fill="#3c4043">api.githubcopilot.com/mcp/</text>

  <rect x="940" y="280" width="220" height="50" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="1050" y="301" font-size="13" text-anchor="middle" fill="#202124">Repo payment-service</text>
  <text x="1050" y="319" font-size="12" text-anchor="middle" fill="#3c4043">CODEOWNERS, branch protection</text>

  <rect x="815" y="370" width="300" height="56" rx="6" fill="#ffffff" stroke="#5f6368" stroke-width="1.5"/>
  <text x="965" y="393" font-size="13" text-anchor="middle" fill="#202124">GitHub Actions workflows</text>
  <text x="965" y="412" font-size="12" text-anchor="middle" fill="#3c4043">codemender-scan.yml, sandbox-validate.yml</text>

  <!-- Google Cloud zone -->
  <rect x="40" y="280" width="250" height="50" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="165" y="301" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">Cloud Logging remote MCP</text>
  <text x="165" y="319" font-size="12" text-anchor="middle" fill="#3c4043">logging.googleapis.com/mcp</text>

  <rect x="330" y="280" width="290" height="50" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="475" y="301" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">codemender-mcp-server</text>
  <text x="475" y="319" font-size="12" text-anchor="middle" fill="#3c4043">Cloud Run, custom MCP server</text>

  <rect x="40" y="400" width="250" height="56" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="165" y="423" font-size="13" text-anchor="middle" fill="#202124">GCS inputs bucket</text>
  <text x="165" y="442" font-size="12" text-anchor="middle" fill="#3c4043">your-gcp-project-id-sandbox-inputs</text>

  <rect x="330" y="400" width="290" height="56" rx="6" fill="#ffffff" stroke="#c5221f" stroke-width="2"/>
  <text x="475" y="423" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">Sandbox: Cloud Run Job</text>
  <text x="475" y="442" font-size="12" text-anchor="middle" fill="#3c4043">codemender-sandbox (gen2, no egress)</text>

  <rect x="40" y="540" width="250" height="80" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="165" y="564" font-size="14" font-weight="bold" text-anchor="middle" fill="#202124">BigQuery</text>
  <text x="165" y="584" font-size="12" text-anchor="middle" fill="#3c4043">codemender, security_lab,</text>
  <text x="165" y="602" font-size="12" text-anchor="middle" fill="#3c4043">scc_export, security_logs</text>

  <rect x="40" y="650" width="110" height="60" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="95" y="676" font-size="12" text-anchor="middle" fill="#202124">SCC continuous</text>
  <text x="95" y="694" font-size="12" text-anchor="middle" fill="#202124">export</text>

  <rect x="160" y="650" width="130" height="60" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="225" y="676" font-size="12" text-anchor="middle" fill="#202124">Model Armor and</text>
  <text x="225" y="694" font-size="12" text-anchor="middle" fill="#202124">VPC SC log sinks</text>

  <rect x="330" y="520" width="290" height="44" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="475" y="547" font-size="13" text-anchor="middle" fill="#202124">Cloud Logging</text>

  <rect x="330" y="590" width="290" height="44" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="475" y="617" font-size="13" text-anchor="middle" fill="#202124">Log sink security-logs-to-pubsub</text>

  <rect x="330" y="660" width="290" height="44" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="475" y="680" font-size="13" text-anchor="middle" fill="#202124">Pub/Sub security-logs</text>
  <text x="475" y="696" font-size="12" text-anchor="middle" fill="#3c4043">dead-letter: security-logs-dlq</text>

  <rect x="330" y="740" width="290" height="44" rx="6" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="475" y="760" font-size="13" text-anchor="middle" fill="#202124">security-log-ingestion</text>
  <text x="475" y="776" font-size="12" text-anchor="middle" fill="#3c4043">Cloud Run service</text>

  <!-- Arrows -->
  <g fill="none" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)">
    <!-- Analyst to app, app to agents -->
    <line x1="130" y1="115" x2="168" y2="115"/>
    <line x1="320" y1="105" x2="348" y2="90"/>
    <line x1="320" y1="125" x2="348" y2="155"/>
    <!-- Agent to the four MCP servers -->
    <line x1="620" y1="85" x2="688" y2="85"/>
    <polyline points="620,108 655,108 655,232 760,232 760,278"/>
    <line x1="400" y1="116" x2="200" y2="278"/>
    <polyline points="350,70 338,70 338,278"/>
    <!-- Data Insights to BigQuery -->
    <polyline points="370,184 370,226 28,226 28,560 38,560"/>
    <!-- codemender-mcp-server to BigQuery, Wiz GraphQL, sandbox job -->
    <line x1="345" y1="330" x2="282" y2="538"/>
    <polyline points="620,300 648,300 648,224 1172,224 1172,85 1162,85"/>
    <line x1="475" y1="330" x2="475" y2="398"/>
    <!-- GitHub: MCP to repo, repo to Actions -->
    <line x1="910" y1="295" x2="938" y2="295"/>
    <line x1="1050" y1="330" x2="1010" y2="368"/>
    <!-- Actions to CodeMender endpoint, sandbox job, GCS, Cloud Logging -->
    <line x1="925" y1="370" x2="925" y2="186"/>
    <line x1="815" y1="400" x2="622" y2="425"/>
    <polyline points="870,426 870,476 165,476 165,458"/>
    <line x1="840" y1="426" x2="622" y2="535"/>
    <!-- Sandbox job reads GCS and writes logs -->
    <line x1="330" y1="428" x2="292" y2="428"/>
    <line x1="475" y1="456" x2="475" y2="518"/>
    <!-- Cloud Logging remote MCP reads Cloud Logging -->
    <polyline points="290,315 310,315 310,542 328,542"/>
    <!-- Log pipeline -->
    <line x1="475" y1="564" x2="475" y2="588"/>
    <line x1="475" y1="634" x2="475" y2="658"/>
    <line x1="475" y1="704" x2="475" y2="738"/>
    <polyline points="330,762 305,762 305,600 292,600"/>
    <!-- Cloud Logging to Model Armor / VPC SC sinks, sinks and SCC to BigQuery -->
    <polyline points="330,556 318,556 318,680 292,680"/>
    <line x1="95" y1="650" x2="95" y2="622"/>
    <line x1="225" y1="650" x2="225" y2="622"/>
  </g>

  <!-- Arrow labels -->
  <text x="485" y="725" font-size="12" fill="#3c4043">OIDC push /pubsub/push</text>
  <text x="702" y="455" font-size="12" fill="#3c4043">execute job</text>
  <text x="482" y="370" font-size="12" fill="#3c4043">start run (confirmed=True)</text>
  <text x="482" y="492" font-size="12" fill="#3c4043">SANDBOX_RESULT</text>
  <text x="670" y="494" font-size="12" fill="#3c4043">stage source</text>
  <text x="680" y="510" font-size="12" fill="#3c4043">and patch</text>

  <!-- Notes -->
  <rect x="670" y="560" width="510" height="200" rx="10" fill="#ffffff" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="686" y="584" font-size="14" font-weight="bold" fill="#202124">Notes</text>
  <text x="686" y="608" font-size="12" fill="#3c4043">Sandbox: Cloud Run Jobs run only on gen2 (microVM), so there is no gVisor.</text>
  <text x="686" y="628" font-size="12" fill="#3c4043">Egress is denied except the restricted Google APIs VIP (199.36.153.4/30).</text>
  <text x="686" y="648" font-size="12" fill="#3c4043">sandbox-runner-sa has no project roles; it can only read the inputs bucket.</text>
  <text x="686" y="672" font-size="12" fill="#3c4043">Code reaches the sandbox through the GCS bucket, not a git clone.</text>
  <text x="686" y="696" font-size="12" fill="#3c4043">The agent opens PRs and starts runs only after the user confirms.</text>
  <text x="686" y="716" font-size="12" fill="#3c4043">It has no merge tool. A human reviewer merges (CODEOWNERS).</text>
  <text x="686" y="740" font-size="12" fill="#3c4043">CodeMender has no public API: configurable endpoint or mock mode.</text>
</svg>
