<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AI Security Agent Lab architecture</title>
  <desc id="desc">An analyst uses the Gemini Enterprise app, which hosts the ADK agent ai_security_agent on Agent Engine and the Data Insights agent. The agent calls four MCP servers: Wiz remote MCP, Cloud Logging remote MCP, GitHub remote MCP, and codemender-mcp-server on Cloud Run. The custom server reads BigQuery, queries the Wiz GraphQL API and starts the sandbox Cloud Run Job, which reads its inputs from a GCS bucket and has no egress. GitHub Actions in the payment-service repo run the scan and sandbox validation. Logs flow from Cloud Logging through a sink and Pub/Sub to security-log-ingestion and into BigQuery. SCC export and Model Armor and VPC SC sinks also write to BigQuery.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="150" y="20" width="490" height="190" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="166" y="42" font-size="14" font-weight="bold" fill="#1a73e8">Gemini Enterprise</text>

  <rect x="670" y="20" width="510" height="190" rx="10" fill="#fdf2e9" stroke="#e8710a" stroke-width="1.5"/>
  <text x="686" y="42" font-size="14" font-weight="bold" fill="#b45309">Security sources</text>

  <rect x="670" y="240" width="510" height="210" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="1.5"/>
  <text x="686" y="262" font-size="14" font-weight="bold" fill="#3c4043">GitHub</text>

  <rect x="20" y="240" width="620" height="560" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="36" y="262" font-size="14" font-weight="bold" fill="#188038">Google Cloud project (your-gcp-project-id)</text>

  <!-- Analyst -->
  <rect x="20" y="90" width="110" height="50" rx="25" fill="#ffffff" stroke="#37474f" stroke-width="1.5"/>
  <text x="75" y="120" font-size="14" text-anchor="middle" fill="#202124">Analyst</text>

  <!-- Gemini Enterprise zone -->
  <rect x="170" y="90" width="150" height="50" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="245" y="111" font-size="13" text-anchor="middle" fill="#202124">Gemini Enterprise</text>
  <text x="245" y="128" font-size="13" text-anchor="middle" fill="#202124">app</text>

  <rect x="350" y="56" width="270" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="485" y="80" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">ADK agent ai_security_agent</text>
  <text x="485" y="99" font-size="12" text-anchor="middle" fill="#3c4043">on Vertex AI Agent Engine</text>

  <rect x="350" y="140" width="270" height="44" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="485" y="167" font-size="13" text-anchor="middle" fill="#202124">Data Insights agent</text>

  <!-- Security sources zone -->
  <rect x="690" y="60" width="220" height="50" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/>
  <text x="800" y="81" font-size="13" font-weight="bold" text-anchor="middle" fill="#202124">Wiz remote MCP</text>
  <text x="800" y="99" font-size="12" text-anchor="middle" fill="#3c4043">mcp.app.wiz.io</text>

  <rect x="940" y="60" width="220" height="50" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/>
  <text x="1050" y="90" font-size="13" text-anchor="middle" fill="#202124">Wiz GraphQL API</text>

  <rect x="810" y="140" width="250" height="44" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/>
  <text x="935" y="167" font-size="13" text-anchor="middle" fill="#202124">CodeMender endpoint or mock mode</text>

  <!-- GitHub zone -->
